[package]
name = "newton-services-operatorsinfo"
description = "Eigen Layer SDK services operatorsinfo"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true

# docs.rs-specific configuration
# see https://docs.rs/about/metadata
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
alloy.workspace = true
async-trait.workspace = true
newton-client-avsregistry.workspace = true
newton-common.workspace = true
newton-crypto-bls.workspace = true
newton-types.workspace = true
newton-utils.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
thiserror.workspace = true
tokio-util = "0.7.11"
tracing.workspace = true
futures.workspace = true
eyre.workspace = true

[dev-dependencies]
# We don't use workspace due to:
# https://github.com/rust-lang/cargo/issues/4242#issuecomment-2578428685
newton-testing-utils = { path = "../../../tests/testing-utils" }
newton-client-elcontracts = { path = "../../chainio/clients/elcontracts" }

ark-bn254.workspace = true
ark-std = { version = "0.4.0", default-features = false }
ark-ff.workspace = true
serial_test.workspace = true
