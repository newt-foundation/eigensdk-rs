[package]
name = "newton-services-avsregistry"
description = "Eigen Layer SDK services avsregistry"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true

# docs.rs-specific configuration
# see https://docs.rs/about/metadata
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
alloy.workspace = true
ark-bn254.workspace = true
ark-ec.workspace = true
async-trait.workspace = true
newton-client-avsregistry.workspace = true
newton-crypto-bls.workspace = true
newton-services-operatorsinfo.workspace = true
newton-types.workspace = true
newton-utils.workspace = true

[dev-dependencies]
# We don't use workspace due to:
# https://github.com/rust-lang/cargo/issues/4242#issuecomment-2578428685
newton-testing-utils = { path = "../../../tests/testing-utils" }

hex.workspace = true
tokio.workspace = true
serde.workspace = true
