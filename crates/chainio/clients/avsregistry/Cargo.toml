[package]
name = "newton-client-avsregistry"
description = "Eigen Layer AvsRegistry Sdk"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true

# docs.rs-specific configuration
# see https://docs.rs/about/metadata
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
alloy.workspace = true
async-trait.workspace = true
num-bigint = "0.4.4"
newton-types.workspace = true
newton-crypto-bls.workspace = true
ark-ff.workspace = true
newton-client-elcontracts.workspace = true
newton-common.workspace = true
newton-utils.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
# We don't use workspace due to:
# https://github.com/rust-lang/cargo/issues/4242#issuecomment-2578428685
newton-testing-utils = { path = "../../../../tests/testing-utils" }

hex = "0.4.3"
once_cell.workspace = true
tokio = { version = "1.37.0", features = ["test-util", "full", "sync"] }
futures-util.workspace = true
