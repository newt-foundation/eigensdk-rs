[package]
name = "newton-crypto-bls"
description = "Eigen layer bls utilities"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true

# docs.rs-specific configuration
# see https://docs.rs/about/metadata
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ark-bn254.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
thiserror.workspace = true
ark-ec.workspace = true
alloy.workspace = true
ark-std = { version = "0.4.0", default-features = false }
serde.workspace = true
newton-crypto-bn254.workspace = true
newton-utils.workspace = true

[dev-dependencies]
# We don't use workspace due to:
# https://github.com/rust-lang/cargo/issues/4242#issuecomment-2578428685
newton-testing-utils = { path = "../../../tests/testing-utils" }

rand = "0.8.4"
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
